<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chameleon Shop - Urban Boutique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo: #d90429;
            --verde: #2dc653;
            --negro: #121212;
            --off-white: #f4f4f4;
            /* Si tienes el archivo eyesome.woff2, aquí se definiría la fuente real */
            --font-script: 'Mrs+Saint+Delafield', cursive; 
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--off-white);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            margin: 0; padding: 20px; color: var(--negro);
        }

        header { text-align: center; margin-bottom: 50px; }
        
        .logo-parche {
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 5px solid var(--negro);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        /* Título con Estilo Eyesome Script */
        header h1 { 
            font-family: 'Mrs Saint Delafield', cursive; /* Sustituto visual de Eyesome */
            font-size: 5.5rem; 
            font-weight: 100;
            color: var(--negro);
            margin: -30px 0 10px 0;
            line-height: 1;
        }

        /* Filtros Urbanos Minimalistas */
        .filtros { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        
        .btn-filtro {
            padding: 10px 20px; border: 2px solid var(--negro);
            background: transparent; cursor: pointer; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-filtro:hover { background: var(--negro); color: white; }

        /* Grid de Productos */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px; max-width: 1200px; margin: 0 auto;
        }

        .producto {
            background: white; border: 1px solid #ddd;
            border-radius: 5px; overflow: hidden;
            transition: transform 0.4s ease;
        }

        .producto:hover { transform: translateY(-10px); }

        /* Galería Interactiva */
        .slider-container { position: relative; width: 100%; height: 400px; background: #fff; }
        .slider-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .slider-container img.active { display: block; }

        .btn-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.8); border: none;
            width: 40px; height: 40px; cursor: pointer; border-radius: 50%;
            font-size: 1rem; transition: 0.3s;
        }
        .btn-nav:hover { background: var(--negro); color: white; }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* Info del producto con toque Eyesome */
        .info { padding: 25px; text-align: left; }
        .info h3 { 
            margin: 0; font-family: 'Mrs Saint Delafield', cursive; 
            font-size: 2.8rem; font-weight: 100;
            color: var(--negro);
        }
        .precio { 
            font-family: 'Montserrat', sans-serif;
            font-weight: 400; font-size: 1.2rem; 
            margin-top: -10px; letter-spacing: 2px;
        }

        .btn-whatsapp {
            display: block; width: 100%; padding: 12px; background: var(--negro);
            color: white; text-decoration: none; text-align: center;
            margin-top: 15px; font-weight: 700; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="logo_camaleon.png" alt="Logo" class="logo-parche">
        <h1>Chameleon</h1>
    </header>

    <div class="filtros">
        <button class="btn-filtro" onclick="filtrar('todos')">All</button>
        <button class="btn-filtro" onclick="filtrar('rojo')">Red</button>
        <button class="btn-filtro" onclick="filtrar('verde')">Green</button>
        <button class="btn-filtro" onclick="filtrar('negro')">Black</button>
    </div>

    <div class="catalogo">
        <div class="producto" data-color="rojo">
            <div class="slider-container">
                <img src="rojo-frente.jpg" class="active">
                <img src="rojo-detalle.jpg">
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Urban Tee</h3>
                <div class="precio">$35.00</div>
                <a href="#" class="btn-whatsapp">Shop Now</a>
            </div>
        </div>

        <div class="producto" data-color="verde">
            <div class="slider-container">
                <img src="verde-1.jpg" class="active">
                <img src="verde-2.jpg">
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Jungle Jacket</h3>
                <div class="precio">$75.00</div>
                <a href="#" class="btn-whatsapp">Shop Now</a>
            </div>
        </div>
    </div>

    <script>
        function cambiarImagen(boton, direccion) {
            const contenedor = boton.parentElement;
            const imagenes = contenedor.querySelectorAll('img');
            let index = Array.from(imagenes).findIndex(img => img.classList.contains('active'));
            imagenes[index].classList.remove('active');
            index = (index + direccion + imagenes.length) % imagenes.length;
            imagenes[index].classList.add('active');
        }

        function filtrar(color) {
            document.querySelectorAll('.producto').forEach(p => {
                p.classList.toggle('hidden', color !== 'todos' && p.dataset.color !== color);
            });
        }
    </script>
</body>
</html>
