<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camaleonica Design</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo: #d90429;
            --verde: #2dc653;
            --negro: #121212;
            --off-white: #f4f4f4;
            --font-script: 'Mrs Saint Delafield', cursive;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--off-white);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            margin: 0; padding: 20px; color: var(--negro);
            line-height: 1.6;
        }

        header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        
        .logo-parche {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 4px solid var(--negro);
            box-shadow: 0px 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            object-fit: cover;
        }

        header h1 { 
            font-family: var(--font-script);
            font-size: 5rem; 
            font-weight: 100;
            color: var(--negro);
            margin: -25px 0 0 0;
            line-height: 1;
        }

        /* --- FILTROS RESPONSIVE --- */
        .filtros { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 40px; 
            flex-wrap: wrap; 
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn-filtro {
            flex: 1 1 auto;
            min-width: 100px;
            padding: 12px 15px; 
            border: 2px solid var(--negro);
            background: white; 
            cursor: pointer; 
            font-weight: 700;
            text-transform: uppercase; 
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-filtro:hover { background: var(--negro); color: white; }

        /* --- CATÁLOGO --- */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px; max-width: 1200px; margin: 0 auto;
        }

        .producto {
            background: white; border: 1px solid #eee;
            border-radius: 8px; overflow: hidden;
            transition: transform 0.3s ease;
            display: flex; flex-direction: column;
        }

        .producto:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* Galería / Slider */
        .slider-container { position: relative; width: 100%; height: 380px; background: #fafafa; }
        .slider-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .slider-container img.active { display: block; }

        .btn-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.9); border: none;
            width: 35px; height: 35px; cursor: pointer; border-radius: 50%;
            font-size: 1rem; z-index: 5; display: flex; align-items: center; justify-content: center;
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* Info del producto */
        .info { padding: 20px; text-align: left; flex-grow: 1; }
        .info h3 { 
            margin: 0; font-family: var(--font-script); 
            font-size: 2.8rem; font-weight: 100; line-height: 0.8;
        }
        .precio { font-size: 1.1rem; margin: 10px 0; letter-spacing: 1px; }

        .btn-whatsapp {
            display: block; width: 100%; padding: 15px; background: var(--negro);
            color: white; text-decoration: none; text-align: center;
            font-weight: 700; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 2px;
            transition: opacity 0.3s;
        }
        .btn-whatsapp:hover { opacity: 0.8; }

        .hidden { display: none; }

        /* --- MEDIA QUERIES (Móvil) --- */
        @media (max-width: 480px) {
            header h1 { font-size: 3.8rem; }
            .filtros {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
            .slider-container { height: 320px; }
            .info h3 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <img src="logo_camaleonica.png" alt="Logo" class="logo-parche">
        <h1>Camaleonica Desing</h1>
    </header>

    <div class="filtros">
        <button class="btn-filtro" onclick="filtrar('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrar('rojo')">Mujer</button>
        <button class="btn-filtro" onclick="filtrar('verde')">Hombre</button>
        <button class="btn-filtro" onclick="filtrar('negro')">Accesorios</button>
    </div>

    <div class="catalogo">
        <div class="producto" data-color="rojo">
            <div class="slider-container">
                <img src="camiseta roja.png" class="active">
                <img src="camiseta roja.png">
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Urban Crimson</h3>
                <div class="precio">$35.00</div>
                <a href="https://wa.me/tu_numero" class="btn-whatsapp">Comprar</a>
            </div>
        </div>

        <div class="producto" data-color="verde">
            <div class="slider-container">
                <img src="chaqueta verde" class="active">
                <img src="chaqueta verde">
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Forest Jacket</h3>
                <div class="precio">$70.00</div>
                <a href="https://wa.me/tu_numero" class="btn-whatsapp">Comprar</a>
            </div>
        </div>
    </div>

    <script>
        // Función para mover las imágenes de la galería
        function cambiarImagen(boton, direccion) {
            const contenedor = boton.parentElement;
            const imagenes = contenedor.querySelectorAll('img');
            let index = Array.from(imagenes).findIndex(img => img.classList.contains('active'));
            
            imagenes[index].classList.remove('active');
            index = (index + direccion + imagenes.length) % imagenes.length;
            imagenes[index].classList.add('active');
        }

        // Función para filtrar por categorías/colores
        function filtrar(color) {
            const productos = document.querySelectorAll('.producto');
            productos.forEach(p => {
                if (color === 'todos' || p.getAttribute('data-color') === color) {
                    p.classList.remove('hidden');
                } else {
                    p.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
