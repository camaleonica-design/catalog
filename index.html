<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camaleonica Design | Black Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo: #d90429;
            --verde: #2dc653;
            --negro-fondo: #0a0a0a; /* Negro más profundo */
            --negro-tarjeta: #1a1a1a; /* Negro para las tarjetas */
            --blanco: #ffffff;
            --font-script: 'Mrs Saint Delafield', cursive;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--negro-fondo); /* Fondo Negro */
            background-image: url('https://www.transparenttextures.com/patterns/p6.png'); /* Textura sutil */
            margin: 0; padding: 20px; 
            color: var(--blanco); /* Letras Blancas */
            line-height: 1.6;
        }

        header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        
        .logo-parche {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 3px solid var(--blanco);
            box-shadow: 0px 5px 15px rgba(255,255,255,0.1);
            margin-bottom: 10px;
            object-fit: cover;
        }

        header h1 { 
            font-family: var(--font-script);
            font-size: 5rem; 
            font-weight: 100;
            color: var(--blanco);
            margin: -25px 0 0 0;
            line-height: 1;
        }

        /* --- FILTROS RESPONSIVE --- */
        .filtros { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 40px; 
            flex-wrap: wrap; 
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn-filtro {
            flex: 1 1 auto;
            min-width: 100px;
            padding: 12px 15px; 
            border: 1px solid var(--blanco);
            background: transparent; 
            color: var(--blanco);
            cursor: pointer; 
            font-weight: 700;
            text-transform: uppercase; 
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-filtro:hover { background: var(--blanco); color: var(--negro-fondo); }

        /* --- CATÁLOGO --- */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px; max-width: 1200px; margin: 0 auto;
        }

        .producto {
            background: var(--negro-tarjeta); /* Tarjeta oscura */
            border: 1px solid #333;
            border-radius: 12px; 
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex; flex-direction: column;
        }

        .producto:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 30px rgba(255,255,255,0.05);
            border-color: var(--rojo);
        }

        /* Galería / Slider */
        .slider-container { position: relative; width: 100%; height: 380px; background: #222; }
        .slider-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .slider-container img.active { display: block; }

        .btn-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); 
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            width: 35px; height: 35px; cursor: pointer; border-radius: 50%;
            font-size: 1rem; z-index: 5; display: flex; align-items: center; justify-content: center;
        }
        .btn-nav:hover { background: var(--rojo); }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* Info del producto */
        .info { padding: 20px; text-align: left; flex-grow: 1; }
        .info h3 { 
            margin: 0; font-family: var(--font-script); 
            font-size: 2.8rem; font-weight: 100; line-height: 0.8;
            color: var(--blanco);
        }
        .precio { font-size: 1.2rem; margin: 10px 0; letter-spacing: 1px; color: var(--rojo); font-weight: 700; }

        .btn-whatsapp {
            display: block; width: 100%; padding: 15px; background: var(--blanco);
            color: var(--negro-fondo); text-decoration: none; text-align: center;
            font-weight: 700; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 2px;
            transition: background 0.3s;
        }
        .btn-whatsapp:hover { background: var(--rojo); color: white; }

        .hidden { display: none; }

        /* --- MEDIA QUERIES --- */
        @media (max-width: 480px) {
            header h1 { font-size: 3.8rem; }
            .filtros {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
            .slider-container { height: 320px; }
            .info h3 { font-size: 2.2rem; }
        }

        /* Estilos del Botón Flotante */
.whatsapp-float {
    position: fixed;
    width: 60px;
    height: 60px;
    bottom: 30px;
    right: 30px;
    background-color: #25d366;
    color: #FFF;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    z-index: 1000; /* Asegura que esté por encima de todo */
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
}

.whatsapp-float img {
    width: 35px;
    height: 35px;
}

.whatsapp-float:hover {
    transform: scale(1.1); /* Se agranda un poco al pasar el mouse */
    background-color: #128c7e;
}

/* Efecto de pulso suave */
@keyframes pulse-whatsapp {
    0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}

.whatsapp-float {
    animation: pulse-whatsapp 2s infinite;
}

/* Ajuste para móviles para que no estorbe tanto */
@media (max-width: 480px) {
    .whatsapp-float {
        width: 50px;
        height: 50px;
        bottom: 20px;
        right: 20px;
    }
    .whatsapp-float img {
        width: 28px;
        height: 28px;
    }
}
    </style>
</head>
<body>

    <header>
        <img src="logo_camaleonica.png" alt="Logo" class="logo-parche">
        <h1>Camaleonica Design</h1>
    </header>

    <div class="filtros">
        <button class="btn-filtro" onclick="filtrar('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrar('rojo')">Mujer</button>
        <button class="btn-filtro" onclick="filtrar('verde')">Hombre</button>
        <button class="btn-filtro" onclick="filtrar('negro')">Accesorios</button>
    </div>

    <div class="catalogo">
        <div class="producto" data-color="rojo">
            <div class="slider-container">
                <img src="camiseta roja.png" class="active">
                <img src="camiseta roja detalle.png">
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Urban Crimson</h3>
                <div class="precio">$35.00</div>
                <a href="https://wa.me/tu_numero" class="btn-whatsapp">Comprar Ahora</a>
            </div>
        </div>

        <div class="producto" data-color="verde">
            <div class="slider-container">
                <img src="chaqueta verde.png" class="active">
                <img src="chaqueta verde detalle.png">
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Forest Jacket</h3>
                <div class="precio">$70.00</div>
                <a href="https://wa.me/tu_numero" class="btn-whatsapp">Comprar Ahora</a>
            </div>
        </div>
    </div>

    <script>
        function cambiarImagen(boton, direccion) {
            const contenedor = boton.parentElement;
            const imagenes = contenedor.querySelectorAll('img');
            let index = Array.from(imagenes).findIndex(img => img.classList.contains('active'));
            
            imagenes[index].classList.remove('active');
            index = (index + direccion + imagenes.length) % imagenes.length;
            imagenes[index].classList.add('active');
        }

        function filtrar(color) {
            const productos = document.querySelectorAll('.producto');
            productos.forEach(p => {
                p.classList.toggle('hidden', color !== 'todos' && p.getAttribute('data-color') !== color);
            });
        }
    </script>
<a href="https://wa.me/571234567890?text=Hola!%20Vi%20tu%20catálogo%20y%20tengo%20una%20consulta." class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>
</body>
</html>
