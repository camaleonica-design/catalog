<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Pro - Varias Imágenes</title>
    <style>
        :root {
            --rojo: #e63946; --verde: #2d6a4f;
            --verde-claro: #95d5b2; --negro: #1a1a1a;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        h1 { text-align: center; }

        .filtros { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .btn-filtro { padding: 10px 15px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; max-width: 1100px; margin: 0 auto;
        }

        /* Contenedor del Producto */
        .producto {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative;
        }

        /* Slider de Imágenes */
        .slider-container { position: relative; width: 100%; height: 350px; overflow: hidden; }
        
        .slider-container img {
            width: 100%; height: 100%; object-fit: cover;
            display: none; /* Ocultamos todas por defecto */
        }

        .slider-container img.active { display: block; }

        /* Botones del Slider */
        .btn-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.7); border: none;
            padding: 10px; cursor: pointer; border-radius: 50%; font-weight: bold;
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        .info { padding: 15px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Catálogo de Ropa</h1>

    <div class="filtros">
        <button class="btn-filtro" onclick="filtrar('todos')">Todos</button>
        <button class="btn-filtro" style="background:var(--rojo); color:white" onclick="filtrar('rojo')">Rojo</button>
        <button class="btn-filtro" style="background:var(--verde); color:white" onclick="filtrar('verde')">Verde</button>
    </div>

    <div class="catalogo">
        <div class="producto" data-color="rojo">
            <div class="slider-container">
                <img src="tu-imagen-roja-1.jpg" class="active" alt="Vista 1">
                <img src="tu-imagen-roja-2.jpg" alt="Vista 2">
                <img src="tu-imagen-roja-3.jpg" alt="Vista 3">
                
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Camiseta Roja Premium</h3>
                <p>$29.99</p>
            </div>
        </div>

        <div class="producto" data-color="verde">
            <div class="slider-container">
                <img src="tu-imagen-verde-1.jpg" class="active" alt="Vista 1">
                <img src="tu-imagen-verde-2.jpg" alt="Vista 2">
                
                <button class="btn-nav prev" onclick="cambiarImagen(this, -1)">&#10094;</button>
                <button class="btn-nav next" onclick="cambiarImagen(this, 1)">&#10095;</button>
            </div>
            <div class="info">
                <h3>Chaqueta Verde</h3>
                <p>$55.00</p>
            </div>
        </div>
    </div>

    <script>
        // Función para cambiar imágenes en el slider
        function cambiarImagen(boton, direccion) {
            const contenedor = boton.parentElement;
            const imagenes = contenedor.querySelectorAll('img');
            let indiceActivo = Array.from(imagenes).findIndex(img => img.classList.contains('active'));

            imagenes[indiceActivo].classList.remove('active');
            
            indiceActivo += direccion;

            if (indiceActivo >= imagenes.length) indiceActivo = 0;
            if (indiceActivo < 0) indiceActivo = imagenes.length - 1;

            imagenes[indiceActivo].classList.add('active');
        }

        // Función de filtrado
        function filtrar(color) {
            const productos = document.querySelectorAll('.producto');
            productos.forEach(p => {
                if (color === 'todos' || p.getAttribute('data-color') === color) {
                    p.classList.remove('hidden');
                } else {
                    p.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
