<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chameleon Shop - Urban Style</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Arial+Black&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo-chameleon: #d90429;
            --verde-chameleon: #2dc653;
            --negro-urban: #121212;
            --off-white: #e0e0e0;
        }

        body { 
            font-family: 'Arial Black', sans-serif; 
            background-color: var(--off-white);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            margin: 0; padding: 20px; color: var(--negro-urban);
        }

        header { text-align: center; margin-bottom: 40px; }
        
        /* Aplicamos la nueva fuente al título principal */
        header h1 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 4.5rem; 
            color: var(--rojo-chameleon);
            margin: -20px 0 10px 0;
            text-shadow: 3px 3px 0px var(--negro-urban);
        }

        .logo-parche {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 6px solid var(--negro-urban);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        /* Botones de filtro */
        .filtros { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }
        .btn-filtro {
            padding: 12px 25px; border: 3px solid var(--negro-urban);
            background: white; cursor: pointer; font-family: 'Arial Black', sans-serif;
            text-transform: uppercase; box-shadow: 4px 4px 0px var(--negro-urban);
        }

        .btn-filtro:hover { background: var(--verde-chameleon); color: white; transform: scale(1.05); }

        /* Tarjetas de Producto */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; max-width: 1100px; margin: 0 auto;
        }

        .producto {
            background: white; border: 4px solid var(--negro-urban);
            border-radius: 15px; overflow: hidden;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
        }

        .slider-container { position: relative; height: 300px; background: #f0f0f0; }
        .slider-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .slider-container img.active { display: block; }

        .info { padding: 15px; }
        .info h3 { 
            margin: 0; 
            font-family: 'Dancing Script', cursive; /* Fuente script también en nombres de productos */
            font-size: 1.8rem; 
        }

        .precio { font-size: 1.5rem; color: var(--rojo-chameleon); margin: 5px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="logo_camaleon.png" alt="Logo" class="logo-parche">
        <h1>Chameleon Shop</h1>
    </header>

    <div class="filtros">
        <button class="btn-filtro" onclick="filtrar('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrar('rojo')">Rojo</button>
        <button class="btn-filtro" onclick="filtrar('verde')">Verde</button>
    </div>

    <div class="catalogo">
        <div class="producto" data-color="rojo">
            <div class="slider-container">
                <img src="prenda_roja_1.png" class="active">
                <img src="prenda_roja_2.png">
            </div>
            <div class="info">
                <h3>Camiseta Flow</h3>
                <div class="precio">$30.00</div>
            </div>
        </div>
        </div>

    <script>
        function filtrar(color) {
            document.querySelectorAll('.producto').forEach(p => {
                p.classList.toggle('hidden', color !== 'todos' && p.dataset.color !== color);
            });
        }
    </script>
</body>
</html>
